<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Courses - HEI</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>



  <main class="main-container">

   

    <!-- PANNEAU DE CONTRÔLE -->

    <section class="filter-card">

     

      <!-- LANGUAGE -->

      <div class="filter-group group-lang">

        <label>LANGUAGE</label>

        <div class="lang-flags">

          <button class="flag-btn" data-lang="MG" title="Malagasy">

            <img src="https://flagcdn.com/w40/mg.png" alt="Madagascar">

          </button>

          <button class="flag-btn" data-lang="FR" title="Français">

            <img src="https://flagcdn.com/w40/fr.png" alt="France">

          </button>

          <button class="flag-btn" data-lang="EN" title="English">

            <img src="https://flagcdn.com/w40/us.png" alt="USA">

          </button>

        </div>

      </div>



      <!-- TECHNOLOGY -->

      <div class="filter-group group-select">

        <label for="tech-select">TECHNOLOGY</label>

        <select id="tech-select">

          <option value="all">All technologies</option>

          <option value="javascript">JavaScript</option>

          <option value="java">Java</option>

          <option value="sql">SQL</option>

          <option value="git">Git</option>

        </select>

      </div>



      <!-- LEVEL -->

      <div class="filter-group group-select">

        <label for="level-select">LEVEL</label>

        <select id="level-select">

          <option value="all">All levels</option>

          <option value="beginner">Beginner</option>

          <option value="intermediate">Intermediate</option>

          <option value="advanced">Advanced</option>

        </select>

      </div>



      <!-- PRICE RANGE -->

      <div class="filter-group group-price">

        <div class="price-title-row">

          <label>PRICE RANGE</label>

          <span class="price-val-text"><span id="price-min-display">0</span> Ar – <span id="price-max-display">300,000</span> Ar</span>

        </div>

        <div class="dual-slider-container">

          <input type="range" id="price-min" class="custom-range" min="0" max="300000" step="5000" value="0">

          <input type="range" id="price-max" class="custom-range" min="0" max="300000" step="5000" value="300000">

        </div>

      </div>



      <!-- SEARCH -->

      <div class="filter-group group-search">

        <label for="search-input">SEARCH</label>

        <input type="text" id="search-input" placeholder="Keywords...">

      </div>



      <!-- CLEAR ALL -->

      <div class="filter-group group-clear">

        <button id="clear-btn" class="clear-btn">CLEAR ALL</button>

      </div>



    </section>



    <!-- COMPTEUR DE RÉSULTATS -->

    <div class="results-info">

      <span id="courses-count">0</span> COURSES FOUND

    </div>



    <!-- GRILLE DES CARTES -->

    <section class="courses-grid" id="courses-grid"></section>

  </main>



  <script src="js/data.js"></script>

  <script src="js/main.js"></script>

</body>

</html>
